<!doctype html><html lang="ru"><meta charset="utf-8"><title>ChatGPT → VS Code</title>
<style>body{font:14px/1.6 system-ui;background:#202020;color:#eee;width:340px;padding:18px}h2{margin:0 0 10px}button{padding:10px 14px;margin:5px 4px 5px 0;border:0;border-radius:8px;cursor:pointer}#connect{background:#397bcc;color:white}.status{border:1px solid #555;padding:12px;border-radius:12px}.note{color:#bbb;font-size:12px}details{margin-top:16px}textarea{width:95%;height:60px;background:#333;color:white}</style>
<h2>ChatGPT → VS Code</h2><div class="status" id="status" role="status">Проверяю соединение…</div>
<p><button id="connect">Подключить VS Code</button><button id="open">Открыть ChatGPT</button></p><p class="note">После первого подключения работает автоматически. Открывайте проекты и чаты как обычно. В VS Code передаётся содержимое загруженных страниц; это пока часть истории аккаунта.</p>
<details><summary>Дополнительно</summary><button id="scan">Прокрутить текущий список</button><button id="disconnect">Отключить этот браузер</button><p>Резервное подключение по коду:</p><textarea id="code" aria-label="Резервный код подключения"></textarea><button id="pair">Применить код</button></details><script src="popup.js"></script></html>
